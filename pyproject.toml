[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dprobe"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    # >=4.47 for Olmo2ForCausalLM; >=4.56 for the from_pretrained `dtype` kwarg
    "transformers>=4.56",
    "scikit-learn",
    "numpy<2",
    "matplotlib",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
